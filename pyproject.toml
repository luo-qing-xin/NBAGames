[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-game"
version = "0.2.0"
description = "Collect and archive complete available NBA single-game data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nba_api==1.11.6",
    "curl_cffi==0.15.0",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nba-game = "nba_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
